name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Build static site
        run: bun run build:pages
        env:
          BUILD_MODE: pages
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Absolute URL for Open Graph / Twitter card images (crawlers need it).
          # For a user-root repo (<user>.github.io) set NEXT_PUBLIC_SITE_URL to
          # https://<user>.github.io and BASE_PATH/NEXT_PUBLIC_BASE_PATH to "".
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # public/.nojekyll rides along with the export (public/* → out/*) so
      # GitHub Pages serves the _next/ directory untouched.
      - name: Verify .nojekyll and brand assets
        run: |
          test -f out/.nojekyll || { echo "::error::out/.nojekyll missing"; exit 1; }
          for f in favicon.ico favicon.svg apple-touch-icon.png site.webmanifest art/og-image.png art/twitter-card.png; do
            test -f "out/$f" || { echo "::error::out/$f missing"; exit 1; }
          done
          echo "✓ .nojekyll present, brand suite exported"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
